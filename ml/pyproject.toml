[project]
name = "airace-ml"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["torch==2.14.1", "numpy>=2.5", "tokenizers>=0.23", "safetensors>=0.8"]

[project.optional-dependencies]
content = ["datasets>=5.1"]

[project.scripts]
airace-ml = "airace_ml.cli:main"
airace-content = "airace_content.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airace_ml", "src/airace_content"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not gpu'"
markers = ["slow: long-running", "gpu: needs CUDA"]

[tool.ruff]
line-length = 100
target-version = "py313"
